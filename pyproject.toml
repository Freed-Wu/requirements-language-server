[project]
name = "requirements-language-server"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Wu, Zhenyu", email = "wuzhenyu@ustc.edu" }]
keywords = ["json schema", "language server", "tree sitter"]
dependencies = [
  "aiohttp>=3",
  "jinja2>=3",
  "lsp-tree-sitter>=0.2.8",
  "marisa-trie>=1",
  "pip>=26",
  "platformdirs>=4",
  "tree-sitter-requirements>=0.6.1",
]

[project.urls]
"Bug Report" = "https://github.com/Freed-Wu/requirements-language-server/issues"
Download = "https://github.com/Freed-Wu/requirements-language-server/releases"
Homepage = "https://requirements-language-server.readthedocs.io"
Source = "https://github.com/Freed-Wu/requirements-language-server"

[project.scripts]
requirements-language-server = "requirements_language_server.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\s*import tomli as tomllib",
]

[tool.doq]
template_path = "templates"

[tool.mdformat]
number = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = ["D205", "D400"]
preview = true

[tool.ruff.format]
docstring-code-format = true
preview = true
